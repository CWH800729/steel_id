<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鋼構構件進度</title><style>:root{font:16px system-ui,'Microsoft JhengHei',sans-serif;color:#23394b;background:#f2f5f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,.button{font:inherit}button,.button{display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid #d5dfe6;border-radius:7px;color:#324b5e;padding:9px 14px;font-size:.875rem;cursor:pointer;white-space:nowrap}button:hover,.button:hover{background:#eef4f8}button.primary{background:#1f536a;border-color:#1f536a;color:#fff}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,.button:focus-within{outline:3px solid #5c9bd1;outline-offset:2px}input:not([type=checkbox]),select{min-width:0;max-width:100%;border:1px solid #d5dfe6;border-radius:6px;background:#fff;color:#23394b;padding:9px 10px;font-size:.875rem}input[type=number]{width:90px}input[type=checkbox]{accent-color:#20637a;width:16px;height:16px}select{appearance:none;padding-right:30px;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235a7487' fill='none'/%3E%3C/svg%3E");background-position:right 10px center;background-repeat:no-repeat}label:not(.button):not(.check){display:flex;flex-direction:column;gap:7px;font-size:.875rem;color:#587083}header{background:#fff;border-bottom:1px solid #dce4e9;padding:22px 4vw;display:flex;justify-content:space-between;align-items:center;gap:20px}.identity{display:flex;align-items:center;gap:13px}.logo{background:#1d4a60;color:#fff;display:grid;place-items:center;width:43px;height:43px;border-radius:10px;font-size:28px}h1{font-size:1.2rem;letter-spacing:.025em;margin:0;font-weight:600}.identity p{font-size:.8rem;color:#6f8696;margin:5px 0 0}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.source{font-size:.8rem;color:#8b6725;background:#fff4dd;border-radius:5px;padding:5px 9px}.page{max-width:1440px;margin:auto;padding:28px 4vw 15px}.scope{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.scope>div:first-child{display:flex;align-items:center;gap:14px}.scope select{font-size:1rem;border:none;background-color:transparent;font-weight:600;padding-left:0}.eyebrow{font-size:.8rem;color:#6b8190;letter-spacing:.05em}.scope-note{text-align:right;font-size:.8rem;color:#748795;line-height:1.7}.scope-note strong{color:#35546b;font-weight:500}.stats{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid #e0e7ec;border-radius:12px;padding:24px 0;margin-bottom:28px}.stats>div{padding:0 26px;border-right:1px solid #e4ebef;display:flex;flex-direction:column;gap:9px}.stats>div:last-child{border-right:0}.stats span{font-size:.875rem;color:#647d8d}.stats strong{font-size:2.3rem;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.stats small{font-size:.8rem;color:#8395a2}.stat-progress strong{color:#217f85}.track{height:6px;background:#e8f0f1;border-radius:3px;margin-top:8px;overflow:hidden}.track i{display:block;height:100%;background:#36999c;border-radius:3px}nav{display:flex;gap:25px;border-bottom:1px solid #d9e3e9;margin-bottom:24px}nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:13px 0;font-size:.95rem;color:#708493}nav button[aria-selected=true]{border-color:#1e647a;color:#204d63;font-weight:600}nav button:hover{background:transparent}.panel{background:#fff;border:1px solid #e0e7ec;border-radius:11px;margin-bottom:22px;padding:24px;min-width:0}.panel-heading{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}h2{margin:0;font-size:1rem;font-weight:600;color:#2b485e}h3{font-size:.9rem;font-weight:600;margin:24px 0 14px}.panel-heading p,.connection p{font-size:.8rem;color:#7c91a0;margin:7px 0 0;line-height:1.6}.chart-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:.8rem;color:#5b7486}.chart-legend span{display:flex;align-items:center;gap:7px}.chart-legend i{width:20px;height:3px;background:#347aa6}.chart-legend i.planned{background:repeating-linear-gradient(90deg,#3a9b91 0 6px,transparent 6px 9px)}#s-chart{display:block;width:100%;height:310px;overflow:visible}.chart-bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid #edf1f4;padding-top:15px;margin-top:8px;color:#8295a2;font-size:.8rem}#plan-gap{color:#446b83}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:.875rem}th{color:#7b8f9d;font-weight:500;background:#f7f9fb}th,td{padding:14px 12px;border-bottom:1px solid #e9eef2;white-space:nowrap}tbody tr:last-child td{border-bottom:0}.member-id{font-weight:500;color:#294e68;font-variant-numeric:tabular-nums}.type-badge{font-size:.75rem;margin-left:9px;color:#668092;background:#edf3f6;padding:3px 6px;border-radius:4px}.type-badge.unknown{color:#8c6a2d;background:#fbf2df}.empty-date{color:#a0aeb8}td.analysis{max-width:380px;white-space:normal;color:#738b9d;font-size:.8rem}.table-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:6px;font-size:.8rem;color:#6b8191;white-space:nowrap}.table-controls input:not([type=checkbox]){width:150px}.pagination{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:20px;font-size:.8rem;color:#708897}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.two-columns{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}.muted{font-size:.8rem;color:#7a8f9e;line-height:1.8}.tag{font-size:.75rem;color:#58828c;background:#eef6f6;padding:5px 9px;border-radius:5px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}.fields input{width:100%}.forecast{background:linear-gradient(140deg,#f5fafb,#fff 70%)}.forecast h2{margin-top:10px}.forecast-value{font-size:2.5rem;color:#215c72;margin-top:24px;font-variant-numeric:tabular-nums}#forecast-days{color:#6b8999;margin:4px 0 22px;font-size:.875rem}.forecast-facts>div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #e4edef;padding:10px 0;font-size:.8rem;color:#7a909b}.forecast-facts strong{color:#3f6576;font-weight:500}.notice{font-size:.8rem;background:#f4f0e8;color:#8b744b;padding:12px;border-radius:5px;line-height:1.75}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:.875rem}.rules span{background:#f4f7fa;padding:12px;border-radius:5px;color:#698195}.rules b{display:block;font-weight:500;color:#2f566b;margin-bottom:5px}details{font-size:.875rem;color:#6b8494;line-height:1.8;margin-top:18px}summary{cursor:pointer;color:#43687d}details p{font-size:.8rem}.connection{border-top:1px solid #dbe5eb;padding:28px 0;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.connection h2{margin-top:7px}.connection details{flex-basis:100%;margin:0}footer{border-top:1px solid #dbe5eb;display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 0;color:#728a9b;font-size:.8rem}[hidden]{display:none!important}#days-body input{width:110px}#days-body td{font-variant-numeric:tabular-nums}#rates-body input{width:70px}#rates-body th,#rates-body td{padding:12px 8px}#plan-rows input{width:160px}#plan-editor .row{margin-top:16px}@media(max-width:1100px){.page{padding:22px 24px}header{padding:18px 24px}.two-columns{grid-template-columns:1fr}.panel-heading{align-items:start;flex-wrap:wrap}.stats>div{padding:0 20px}}@media(max-width:700px){header{flex-wrap:wrap}.page{padding:20px 14px}.stats{grid-template-columns:1fr 1fr;gap:24px 0}.stats>div:nth-child(2){border-right:0}.stats strong{font-size:2rem}.panel{padding:18px 14px}.scope-note{font-size:.75rem}.scope>div:first-child{gap:7px;flex-wrap:wrap}.chart-legend{gap:10px}.table-controls{gap:8px}.rules{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}.chart-bottom{line-height:1.7}#s-chart{height:280px}.actions{gap:5px}.forecast-value{font-size:2rem}}@media print{header .actions,nav,.connection,footer button,.table-controls,.pagination button,#plan-editor{display:none}.page{padding:0}.panel{break-inside:avoid}}

.schedule-fields{grid-template-columns:repeat(3,minmax(0,1fr))}.schedule-fields input{width:100%}#actual-lift-rows input{width:160px}.chart-legend .revised{background:repeating-linear-gradient(90deg,#bd8335 0 5px,transparent 5px 8px)}@media(max-width:700px){.schedule-fields{grid-template-columns:1fr}#actual-lift-rows input{width:120px}}
</style></head><body>
<header><div class="identity"><span class="logo">▥</span><div><h1>鋼構構件進度</h1><p>本機 JSON 進度檢視</p></div></div><div class="actions"><span id="source" class="source">尚未開啟 JSON</span><input id="json-file" type="file" accept=".json,application/json" hidden><button id="open-json">開啟 JSON</button><button id="save-json" disabled>儲存 JSON</button></div></header>
<div class="page"><div class="scope"><div><span class="eyebrow">樓層／節次</span><select id="section" aria-label="樓層／節次"><option value="all">全案</option></select></div><div class="scope-note">統計截至 <strong id="asof"></strong><br>完成日修改後請儲存 JSON</div></div>
<section class="stats" aria-label="構件進度摘要"><div><span>已確認標示數量</span><strong id="total">—</strong><small>依目前施工節次</small></div><div><span>已完成吊裝</span><strong id="completed">—</strong><small id="completion-rate">等待資料</small></div><div><span>剩餘數</span><strong id="remaining">—</strong><small>尚未完成吊裝</small></div><div class="stat-progress"><span>吊裝完成率</span><strong id="percent">—</strong><div class="track"><i id="progress-fill"></i></div></div></section>
<section class="panel chart-panel"><div class="panel-heading"><div><h2>累計吊裝進度</h2><p>依 JSON 的完成日統計</p></div><div class="chart-legend"><span><i class="actual"></i>實際吊裝</span></div></div><svg id="s-chart" role="img" aria-label="日期與累計構件數"></svg><div class="chart-bottom"><span id="chart-note">等待 JSON 資料</span><span>橫軸日期 · 縱軸累計標示數量</span></div></section>
<section class="panel"><div class="panel-heading"><div><h2>構件明細</h2><p>數量為 CAD 標示數量，未跨視圖去重；每列為一個計算用標示單位</p></div><div class="table-controls"><label class="check"><input id="show-analysis" type="checkbox">顯示分析編號</label><select id="filter-column" aria-label="篩選欄位"></select><input id="search" placeholder="包含的文字" aria-label="包含的文字"><select id="type-filter" aria-label="構件類型"><option value="all">全部類型</option></select></div></div><div class="table-wrap"><table id="members-table"><thead id="members-head"></thead><tbody id="members-body"></tbody></table></div><div class="pagination"><span id="table-count"></span><div class="row"><button id="prev">上一頁</button><span id="page-number"></span><button id="next">下一頁</button></div></div></section>
<dialog id="date-dialog" style="border:1px solid #d5dfe6;border-radius:10px;padding:24px;max-width:min(420px,95vw)"><h2 id="date-title">完成日</h2><p id="date-note" class="muted"></p><label>完成日<input id="date-input" placeholder="YYYYMMDD"></label><div class="row" style="margin-top:20px"><button id="date-save" class="primary">套用到目前資料</button><button id="date-cancel">取消</button></div><p id="date-status" role="status"></p></dialog>
<footer><span id="status" role="status" aria-live="polite">請開啟 JSON 檔案。</span></footer></div><script type="module">const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
const TODAY=['year','month','day'].map(type=>parts.find(part=>part.type===type).value).join('-');
function dateValue(input,optional=false){
  const raw=String(input??'').trim();if(!raw&&optional)return'';
  const compact=raw.match(/^(\d{4})(\d{2})(\d{2})$/);
  const text=compact?`${compact[1]}-${compact[2]}-${compact[3]}`:raw.replaceAll('/','-');
  const date=new Date(text+'T12:00:00Z');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(text)||Number.isNaN(date.getTime())||date.toISOString().slice(0,10)!==text)throw Error('無效日期：'+raw);
  return text;
}

function simpleSheetToState(data){
  if(!data||!['steel-sheet-api-v1','steel-progress-json-v1'].includes(data.schema)||!Array.isArray(data.rows))throw Error('JSON資料格式不符');
  const required=['完整名稱','標示數量合計','完成日'];
  const missing=required.filter(field=>!data.headers?.includes(field));if(missing.length)throw Error('JSON 缺少欄位：'+missing.join('、'));
  const members=[],apiRows=Object.create(null),quantities=Object.create(null);let skippedName=0,skippedQuantity=0,invalidDates=0;
  for(const row of data.rows){
    const values=row.values||{},name=String(values['完整名稱']??'').trim(),rawQuantity=String(values['標示數量合計']??'').trim();
    if(!name){skippedName++;continue;}
    if(!/^[0-9]+$/.test(rawQuantity)||!Number.isSafeInteger(Number(rawQuantity))||Number(rawQuantity)<1){skippedQuantity++;continue;}
    const quantity=Number(rawQuantity),sourceRow=Number(row.rowNumber);
    if(!Number.isInteger(sourceRow)||sourceRow<2||members.length+quantity>200000)throw Error('資料列或標示數量超出網頁可處理範圍');
    let lift='';try{lift=dateValue(values['完成日'],true);}catch{invalidDates++;}
    const kind=String(values['構件類型']??'').trim()||'未分類',section=String(values['樓層／節次']??'').trim()||'未指定',analysis=['分區','樓層／節次','大梁方向(G/B)','小梁方向(X/Y)','流水號','構件類型','構件代碼','未拆分尾碼'].map(field=>String(values[field]??'')).join('｜');
    if(apiRows[sourceRow])throw Error('JSON來源列號重複：'+sourceRow);
    apiRows[sourceRow]=row;quantities[sourceRow]=quantity;
    for(let ordinal=1;ordinal<=quantity;ordinal++)members.push({id:sourceRow+':'+ordinal,sourceRow,ordinal,name,section,type:kind,analysis,lift,weld:''});
  }
  return{members,apiRows,quantities,skippedName,skippedQuantity,invalidDates};
}

const get=id=>document.getElementById(id),fmt=value=>Number(value).toLocaleString('zh-TW'),dateText=value=>value?value.replaceAll('-','/'):'—';
const svgNode=(name,attributes={},value)=>{const node=document.createElementNS('http://www.w3.org/2000/svg',name);for(const [key,item] of Object.entries(attributes))node.setAttribute(key,item);if(value!==undefined)node.textContent=value;return node;};
const FIELDS=['完整名稱','分區','樓層／節次','大梁方向(G/B)','小梁方向(X/Y)','流水號','構件類型','構件代碼','未拆分尾碼','出現次數','標示數量合計','完成日'];
const PAGE=18;let state=null,documentData=null,fileName='構件進度.json',fileHandle=null,dirty=false,section='all',query='',type='all',page=0,editing=null;
get('filter-column').replaceChildren(...FIELDS.map(field=>new Option(field,field)));
get('asof').textContent=dateText(TODAY);
function members(){return(state?.members||[]).filter(member=>section==='all'||member.section===section);}
function render(){
  const list=members(),done=list.filter(member=>member.lift&&member.lift<=TODAY),ratio=list.length?done.length/list.length:0;
  for(const [id,value] of Object.entries({total:state?fmt(list.length):'—',completed:state?fmt(done.length):'—',remaining:state?fmt(list.length-done.length):'—',percent:state?`${(ratio*100).toFixed(1)}%`:'—'}))get(id).textContent=value;
  get('completion-rate').textContent=state?`${fmt(done.length)} / ${fmt(list.length)} 件`:'等待資料';get('progress-fill').style.width=state?`${ratio*100}%`:'0%';
  renderMembers(list);renderChart(list,done);
}
function renderMembers(list){
  const field=get('filter-column').value;
  const filtered=list.filter(member=>(type==='all'||member.type===type)&&(!query||String(state?.apiRows?.[member.sourceRow]?.values?.[field]??'').toLocaleLowerCase().includes(query.toLocaleLowerCase())));
  page=Math.min(page,Math.max(0,Math.ceil(filtered.length/PAGE)-1));
  const head=document.createElement('tr');for(const label of ['構件編號',...(get('show-analysis').checked?['分析編號']:[]),'完成日','操作']){const th=document.createElement('th');th.textContent=label;head.append(th);}get('members-head').replaceChildren(head);
  const body=get('members-body');body.replaceChildren();
  for(const member of filtered.slice(page*PAGE,(page+1)*PAGE)){
    const row=document.createElement('tr'),name=row.insertCell();name.className='member-id';name.textContent=member.name;
    const badge=document.createElement('span');badge.className='type-badge';badge.textContent=member.type;name.append(badge);
    const quantity=state.quantities?.[member.sourceRow];if(quantity>1){const unit=document.createElement('span');unit.className='type-badge';unit.textContent=`${member.ordinal}/${quantity}`;name.append(unit);}
    if(get('show-analysis').checked){const cell=row.insertCell();cell.className='analysis';cell.textContent=member.analysis;}
    const cell=row.insertCell();cell.textContent=dateText(member.lift);if(!member.lift)cell.className='empty-date';
    const action=row.insertCell(),edit=document.createElement('button');edit.textContent='填寫完成日';edit.onclick=()=>openDateEditor(member);action.append(edit);body.append(row);
  }
  get('table-count').textContent=state?`顯示 ${filtered.length?fmt(page*PAGE+1):0}–${fmt(Math.min((page+1)*PAGE,filtered.length))} / ${fmt(filtered.length)} 件`:'等待資料';
  get('page-number').textContent=`第 ${page+1} / ${Math.max(1,Math.ceil(filtered.length/PAGE))} 頁`;get('prev').disabled=page===0;get('next').disabled=(page+1)*PAGE>=filtered.length;
}
function renderChart(list,done){
  const svg=get('s-chart'),width=Math.max(320,svg.clientWidth||800),height=310,left=58,right=28,top=28,bottom=42;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.replaceChildren();
  if(!state){get('chart-note').textContent='等待 JSON 資料';return;}
  const dates=[...new Set(done.map(member=>member.lift))].sort(),day=86400000,end=Date.parse(TODAY),start=Math.min(end,...dates.map(date=>Date.parse(date)))-day,span=Math.max(day,end-start),max=Math.max(list.length,1);
  const x=value=>left+(Date.parse(value)-start)/span*(width-left-right),y=value=>top+(max-value)/max*(height-top-bottom);
  for(let index=0;index<=4;index++){const count=Math.round(max*index/4),vertical=y(count);svg.append(svgNode('line',{x1:left,y1:vertical,x2:width-right,y2:vertical,stroke:'#e5edf2'}),svgNode('text',{x:left-12,y:vertical+4,'text-anchor':'end',fill:'#7c929f','font-size':12},fmt(count)));}
  const ticks=Math.min(width<500?3:6,Math.floor(span/day)+1);for(let index=0;index<ticks;index++){const date=new Date(start+span*index/(ticks-1)).toISOString().slice(0,10);svg.append(svgNode('text',{x:x(date),y:height-13,'text-anchor':'middle',fill:'#7c929f','font-size':12},date.slice(5).replace('-','/')));}
  let cumulative=0,path=`M ${left} ${y(0)}`;for(const date of dates){path+=` H ${x(date)}`;cumulative+=done.filter(member=>member.lift===date).length;path+=` V ${y(cumulative)}`;}path+=` H ${x(TODAY)}`;svg.append(svgNode('path',{d:path,fill:'none',stroke:'#347aa6','stroke-width':3,'stroke-linejoin':'round'}));
  get('chart-note').textContent=`截至 ${dateText(TODAY)}，已完成吊裝 ${fmt(done.length)} 件；尚餘 ${fmt(list.length-done.length)} 件`;
}
function openDateEditor(member){
  const source=state?.apiRows?.[member.sourceRow];if(!source){get('status').textContent='找不到此構件的來源列，請重新開啟 JSON。';return;}
  editing={...source};get('date-title').textContent=member.name;
  const quantity=state.quantities[member.sourceRow];
  get('date-note').textContent=quantity>1?`此編號的標示數量為 ${quantity}；填寫日期會套用來源列的全部標示單位。`:'日期會套用到此編號的來源列。';
  get('date-input').value=source.values['完成日']||'';get('date-status').textContent='';get('date-dialog').showModal();
}
get('date-cancel').onclick=()=>get('date-dialog').close();
get('date-save').onclick=()=>{
  if(!editing)return;
  try{
    const completed=dateValue(get('date-input').value,true);
    const row=documentData.rows.find(item=>item.rowNumber===editing.rowNumber);
    if(!row)throw Error('來源列不存在，請重新開啟 JSON');
    row.values['完成日']=completed?completed.replaceAll('-','/'):'';
    state=simpleSheetToState(documentData);dirty=true;get('save-json').disabled=false;
    get('source').textContent=fileName+' · 尚未儲存';get('date-dialog').close();get('status').textContent='完成日已修改；請按「儲存 JSON」。';render();
  }catch(error){get('date-status').textContent=error.message;}
};
function loadJson(text,name,handle=null){
  if(dirty&&!confirm('目前的修改尚未儲存，確定開啟另一個 JSON？'))return;
  try{
    const data=JSON.parse(text),next=simpleSheetToState(data);
    documentData=data;state=next;fileName=name;fileHandle=handle;dirty=false;section='all';page=0;
    const selector=get('section');selector.replaceChildren(new Option('全案','all'));for(const value of [...new Set(state.members.map(member=>member.section))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})))selector.add(new Option(value,value));
    const types=get('type-filter');types.replaceChildren(new Option('全部類型','all'));for(const value of [...new Set(state.members.map(member=>member.type))].sort())types.add(new Option(value,value));type='all';
    get('source').textContent=fileName;get('save-json').disabled=false;
    get('status').textContent='已開啟 JSON。'+(state.skippedName?` ${state.skippedName} 列缺少完整名稱，未計入件數。`:'')+(state.skippedQuantity?` ${state.skippedQuantity} 列數量未填或無法辨識，未計入件數。`:'')+(state.invalidDates?` ${state.invalidDates} 列完成日格式無法辨識，暫不列入已完成。`:'');render();
  }catch(error){get('status').textContent='無法開啟 JSON：'+error.message;}
}
get('open-json').onclick=async()=>{
  if(window.showOpenFilePicker){
    try{const [handle]=await showOpenFilePicker({types:[{description:'JSON',accept:{'application/json':['.json']}}],multiple:false});const file=await handle.getFile();loadJson(await file.text(),file.name,handle);return;}
    catch(error){if(error.name==='AbortError')return;}
  }
  get('json-file').click();
};
get('json-file').onchange=async event=>{const file=event.target.files[0];if(file)loadJson(await file.text(),file.name);event.target.value='';};
get('save-json').onclick=async()=>{
  if(!documentData)return;
  const text=JSON.stringify(documentData,null,2)+'\n';
  try{
    if(fileHandle&&fileHandle.createWritable){const stream=await fileHandle.createWritable();await stream.write(text);await stream.close();dirty=false;get('source').textContent=fileName;get('status').textContent='已儲存 JSON：'+fileName;return;}
    if(window.showSaveFilePicker){
      try{const handle=await showSaveFilePicker({suggestedName:fileName,types:[{description:'JSON',accept:{'application/json':['.json']}}]});const stream=await handle.createWritable();await stream.write(text);await stream.close();fileHandle=handle;dirty=false;get('source').textContent=fileName;get('status').textContent='已儲存 JSON：'+fileName;return;}
      catch(error){if(error.name==='AbortError')return;}
    }
    const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download=fileName;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
    get('status').textContent='已下載 JSON，請用新檔取代原檔。';dirty=false;get('source').textContent=fileName;
  }catch(error){get('status').textContent='儲存未完成：'+error.message;}
};
get('section').onchange=event=>{section=event.target.value;page=0;render();};
get('search').oninput=event=>{query=event.target.value;page=0;renderMembers(members());};get('type-filter').onchange=event=>{type=event.target.value;page=0;renderMembers(members());};get('show-analysis').onchange=()=>renderMembers(members());
get('filter-column').onchange=()=>{page=0;renderMembers(members());};
get('prev').onclick=()=>{page--;renderMembers(members());};get('next').onclick=()=>{page++;renderMembers(members());};
new ResizeObserver(()=>renderChart(members(),members().filter(member=>member.lift&&member.lift<=TODAY))).observe(get('s-chart'));
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
render();
</script></body></html>
