orecast h2{margin-top:10px}.forecast-value{font-size:2.5rem;color:#215c72;margin-top:24px;font-variant-numeric:tabular-nums}#forecast-days{color:#6b8999;margin:4px 0 22px;font-size:.875rem}.forecast-facts>div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #e4edef;padding:10px 0;font-size:.8rem;color:#7a909b}.forecast-facts strong{color:#3f6576;font-weight:500}.notice{font-size:.8rem;background:#f4f0e8;color:#8b744b;padding:12px;border-radius:5px;line-height:1.75}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:.875rem}.rules span{background:#f4f7fa;padding:12px;border-radius:5px;color:#698195}.rules b{display:block;font-weight:500;color:#2f566b;margin-bottom:5px}details{font-size:.875rem;color:#6b8494;line-height:1.8;margin-top:18px}summary{cursor:pointer;color:#43687d}details p{font-size:.8rem}.connection{border-top:1px solid #dbe5eb;padding:28px 0;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.connection h2{margin-top:7px}.connection details{flex-basis:100%;margin:0}footer{border-top:1px solid #dbe5eb;display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 0;color:#728a9b;font-size:.8rem}[hidden]{display:none!important}#days-body input{width:110px}#days-body td{font-variant-numeric:tabular-nums}#rates-body input{width:70px}#rates-body th,#rates-body td{padding:12px 8px}#plan-rows input{width:160px}#plan-editor .row{margin-top:16px}@media(max-width:1100px){.page{padding:22px 24px}header{padding:18px 24px}.two-columns{grid-template-columns:1fr}.panel-heading{align-items:start;flex-wrap:wrap}.stats>div{padding:0 20px}}@media(max-width:700px){header{flex-wrap:wrap}.page{padding:20px 14px}.stats{grid-template-columns:1fr 1fr;gap:24px 0}.stats>div:nth-child(2){border-right:0}.stats strong{font-size:2rem}.panel{padding:18px 14px}.scope-note{font-size:.75rem}.scope>div:first-child{gap:7px;flex-wrap:wrap}.chart-legend{gap:10px}.table-controls{gap:8px}. <header><div class="identity"><span class="logo">▥</span><div><h1>鋼構構件進度</h1><p>Google Sheet 進度檢視</p></div></div><div class="actions"><span id="source" class="source">正在讀取 Google Sheet</span><button id="google-read">從 Google Sheet 更新</button></div></header>
<div class="page"><div class="scope"><div><span class="eyebrow">樓層／節次</span><select id="section" aria-label="樓層／節次"><option value="all">全案</option></select></div><div class="scope-note">統計截至 <strong id="asof"></strong><br>資料與日期請在 Google Sheet 修改</div></div>

<section class="panel"><div class="panel-heading"><div><h2>構件明細</h2><p>數量為 CAD 標示數量，未跨視圖去重；每列為一個計算用標示單位</p></div><div class="table-controls"><label class="check"><input id="show-analysis" type="checkbox">顯示分析編號</label><select id="filter-column" aria-label="篩選欄位"></select><input id="search" placeholder="包含的文字" aria-label="包含的文字"><select id="type-filter" aria-label="構件類型"><option value="all">全部類型</option></select></div></div><div class="table-wrap"><table id="members-table"><thead id="members-head"></thead><tbody id="members-body"></tbody></table></div><div class="pagination"><span id="table-count"></span><div class="row"><button id="prev">上一頁</button><span id="page-number"></span><button id="next">下一頁</button></div></div></section>
<dialog id="date-dialog" style="border:1px solid #d5dfe6;border-radius:10px;padding:24px;max-width:min(420px,95vw)"><h2 id="date-title">完成日</h2><p id="date-note" class="muted"></p><label>完成日<input id="date-input" placeholder="YYYYMMDD"></label><div class="row" style="margin-top:20px"><button id="date-save" class="primary">寫回 Google Sheet</button><button id="date-cancel">取消</button></div><p id="date-status" role="status"></p></dialog>
<footer><span id="status" role="status" aria-live="polite">正在讀取 Google Sheet…</span></footer></div><script type="module">const SHEET_API_URL='https://script.google.com/macros/s/AKfycby2_yu-RR2vDofagSV1QMmqQPl7jP2u2KzIrxkVFh-VxLJL11JZxdWotwr_cc4nBJ20/exec';

const TYPES=['柱','大梁','小梁','側撐','BRB','塔吊補強','待確認'];
const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
const TODAY=['year','month','day'].map(type=>parts.find(part=>part.type===type).value).join('-');
function dateValue(input,optional=false){
  const raw=String(input??'').trim();if(!raw&&optional)return '';
  const compact=raw.match(/^(\d{4})(\d{2})(\d{2})$/);
  const text=compact?`${compact[1]}-${compact[2]}-${compact[3]}`:raw.replaceAll('/','-');
  const date=new Date(text+'T12:00:00Z');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(text)||Number.isNaN(date.getTime())||date.toISOString().slice(0,10)!==text)throw Error('無效日期：'+raw);
  return text;
}
function classify(raw,explicit=''){
  const name=String(raw??'').trim().toUpperCase();
  let type='待確認',analysis='',section='';
  const match=name.match(/^([A-Z]+)(\d+)(.+)$/);
  if(/^AV[A-Z]*\d/.test(name)){type='塔吊補強';analysis='AV｜塔吊補強';}
  else if(match){
    const [,area,level,tail]=match;section=String(Number(level));
    if(/^[BG]\d+$/.test(tail)&&name.length>=5&&name.length<=6)type='大梁';
    else if(/^[XY]\d+$/.test(tail)&&name.length>=5&&name.length<=6)type='小梁';
    else if(/^C[X]\d+Y\d+$/.test(tail))type='柱';
    else if(/^(WL|L)\d+$/.test(tail))type='側撐';
    else if(/^BU([XY])?\d+$/.test(tail))type='BRB';
    analysis=`${area}區｜編號段 ${level}｜${tail}｜${type}`;
  } else analysis='不符合已知完整編號規則';
  if(explicit){if(!TYPES.includes(explicit))throw Error('不支援的構件類型：'+explicit);type=explicit;analysis+='｜資料指定：'+explicit;}
  return {name,type,analysis,section};
}
function initialSettings(){return{reference:20,minutesPerDay:420,plannedBatch:{柱:1,大梁:1,小梁:2,側撐:2,BRB:1,塔吊補強:1,待確認:1},rates:{柱:[null,30,null,null],大梁:[null,20,null,null],小梁:[null,10,10,10],側撐:[null,null,null,null],BRB:[null,null,null,null],塔吊補強:[null,null,null,null],待確認:[null,null,null,null]}};}
function minutes(settings,type,size=1){const value=settings.rates[type]?.[size];return typeof value==='number'&&Number.isFinite(value)&&value>0?value:null;}
function normalizeMembers(rows){
  const ids=new Set();return rows.map((row,index)=>{
    const id=String(row['構件ID']||'').trim(),name=String(row['構件編號']||row.Name||'').trim(),section=String(row['節次']||'').trim();
    if(!id||!name||!section)throw Error(`第 ${index+2} 列缺少構件ID、節次或構件編號`);
    if(ids.has(id))throw Error('構件ID重複：'+id);ids.add(id);
    const lift=dateValue(row['吊裝完成日期'],true),weld=dateValue(row['電銲完成日期'],true);
    if(weld&&(!lift||weld<lift))throw Error('電銲日期早於吊裝日期或缺少吊裝日期：'+id);
    const explicit=String(row['構件類型']||'').trim();
    return{id,...classify(name,explicit),name,section,explicit,lift,weld,batch:String(row['吊次編號']||'').trim()};
  });
}
function validatePlan(rows,total){
  const sorted=rows.map(row=>({date:dateValue(row.date),count:Number(row.count)})).sort((left,right)=>left.date.localeCompare(right.date));
  let previous=-1;const dates=new Set();
  for(const row of sorted){if(!Number.isInteger(row.count)||row.count<0||row.count>total||row.count<previous||dates.has(row.date))throw Error('預計累計數須為不超過總件數的遞增整數，日期不可重複');previous=row.count;dates.add(row.date);}
  return sorted;
}
function interpolatePlan(plan,date){
  if(!plan.length||date<plan[0].date)return null;
  if(date>=plan.at(-1).date)return plan.at(-1).count;
  const upper=plan.findIndex(point=>point.date>date),left=plan[upper-1],right=plan[upper];
  const fraction=(Date.parse(date)-Date.parse(left.date))/(Date.parse(right.date)-Date.parse(left.date));
  return left.count+(right.count-left.count)*fraction;
}
function validateSchedule(input){
  const startDate=dateValue(input.startDate),dailyLifts=Number(input.dailyLifts),workweek=Number(input.workweek??7);
  if(!Number.isInteger(dailyLifts)||dailyLifts<1||dailyLifts>10000)throw Error('每天預計吊數須為1～10000的整數');
  if(![5,6,7].includes(workweek))throw Error('施工週設定不正確');
  return{startDate,dailyLifts,workweek};
}
function shiftDate(date,days){return new Date(Date.parse(date)+days*86400000).toISOString().slice(0,10);}
function liftQueue(members,settings){
  const groups=new Map(),queue=[];
  for(const member of members){const key=JSON.stringify([member.section,member.type]);if(!groups.has(key))groups.set(key,{type:member.type,items:[]});groups.get(key).items.push(member);}
  for(const {type,items}of groups.values()){
    const size=['小梁','側撐'].includes(type)?Number(settings.plannedBatch[type]||1):1;
    if(![1,2,3].includes(size))throw Error('每吊件數須為1～3');
    for(let offset=0;offset<items.length;offset+=size){const batch=items.slice(offset,offset+size);queue.push({size:batch.length,ids:batch.map(member=>member.id)});}
  }
  return queue;
}
function curveFromQueue(queue,startDate,initialCount,config){
  const points=[{date:shiftDate(startDate,-1),count:initialCount}];let offset=0,count=initialCount,date=startDate,workingDays=0;
  for(let elapsed=0;offset<queue.length;elapsed++,date=shiftDate(date,1)){
    if(elapsed>100000)throw Error('推估期間過長，請提高每日預計吊數');
    const weekday=new Date(date+'T12:00:00Z').getUTCDay();
    if(config.workweek===6&&weekday===0||config.workweek===5&&(weekday===0||weekday===6))continue;
    for(let index=0;index<config.dailyLifts&&offset<queue.length;index++)count+=queue[offset++].size;
    points.push({date,count});workingDays++;
  }
  return{points,workingDays,finishDate:points.at(-1).date};
}
function automaticSchedule(members,settings,input,reports={},asOf=TODAY){
  const config=validateSchedule(input),installed=members.filter(member=>member.lift&&member.lift<=asOf),pending=members.filter(member=>!member.lift||member.lift>asOf);
  const original=curveFromQueue(liftQueue(members,settings),config.startDate,0,config);
  const queue=liftQueue(pending,settings),warnings=[];let extraLifts=0,inferredCount=0;
  const byDate=new Map();for(const member of installed){if(!byDate.has(member.lift))byDate.set(member.lift,[]);byDate.get(member.lift).push(member);}
  for(const [date,value]of Object.entries(reports).sort(([left],[right])=>left.localeCompare(right))){
    dateValue(date);if(!Number.isInteger(value)||value<0)throw Error('實際吊數須為非負整數');if(date>asOf)continue;
    const day=byDate.get(date)||[],known=new Set();let ambiguous=false;
    for(const member of day){if(!member.batch&&['小梁','側撐'].includes(member.type))ambiguous=true;else known.add(member.batch||'single:'+member.id);}
    if(ambiguous){warnings.push(`${date} 有已安裝小梁／側撐未填吊次編號，該日只扣已確認構件，未再折算吊數`);continue;}
    if(value<known.size)warnings.push(`${date} 填寫吊數少於已記錄吊次，優先保留已安裝構件`);
    extraLifts+=Math.max(0,value-known.size);
  }
  const appliedLifts=Math.min(extraLifts,queue.length);
  const inferredIds=[];for(let index=0;index<appliedLifts;index++){inferredCount+=queue[index].size;inferredIds.push(...queue[index].ids);}
  if(extraLifts>queue.length)warnings.push('填寫吊數超過可推估剩餘吊次，已限制在總構件數內');
  if(pending.some(member=>member.type==='待確認'))warnings.push('待確認類型暫按1件／吊推估，請確認分類');
  const outstanding=queue.slice(appliedLifts),baseline=installed.length+inferredCount,start=config.startDate>asOf?config.startDate:shiftDate(asOf,1);
  const revised=curveFromQueue(outstanding,start,baseline,config);
  revised.points=[{date:asOf,count:baseline},...revised.points.filter(point=>point.date>asOf)];
  return{config,original:original.points,revised:revised.points,finishDate:outstanding.length?revised.finishDate:asOf,workingDays:revised.workingDays,installedCount:installed.length,inferredCount,inferredIds,appliedLifts,remainingLifts:outstanding.length,remainingCount:members.length-baseline,warnings};
}
function plannedWorkload(members,settings){
  let cost=0;const missing=[];
  for(const type of TYPES){
    const count=members.filter(member=>member.type===type).length;if(!count)continue;
    const size=['小梁','側撐'].includes(type)?Number(settings.plannedBatch[type]):1;
    const full=Math.floor(count/size),tail=count%size;
    for(const [quantity,number]of [[size,full],[tail,tail?1:0]]){
      if(!number)continue;const rate=minutes(settings,type,quantity);
      if(rate===null)missing.push(`${type}一吊${quantity}件`);else cost+=rate*number;
    }
  }
  return{cost:missing.length?null:cost,knownCost:cost,missing:[...new Set(missing)]};
}
function analyzeDays(members,settings,actualMinutes,asOf=TODAY){
  const dates=[...new Set(members.map(member=>member.lift).filter(date=>date&&date<=asOf))].sort();
  return dates.map(date=>{
    const day=members.filter(member=>member.lift===date),batches=new Map(),issues=[];
    let equivalent=0,unknown=0;
    for(const member of day){
      const single=minutes(settings,member.type);if(single===null)unknown++;else equivalent+=single/settings.reference;
      if(!member.batch&&['小梁','側撐'].includes(member.type)){issues.push('小梁／側撐缺吊次編號');continue;}
      const key=member.batch||`single:${member.id}`;
      if(!batches.has(key))batches.set(key,[]);batches.get(key).push(member);
    }
    let standard=0;
    for(const group of batches.values()){
      const type=group[0].type,size=group.length;
      if(group.some(member=>member.type!==type)){issues.push('同一吊次混用不同類型');continue;}
      if(size>1&&!['小梁','側撐'].includes(type)){issues.push('柱／大梁等類型須單件一吊');continue;}
      const rate=minutes(settings,type,size);if(rate===null)issues.push('缺少批次標準分鐘');else standard+=rate;
    }
    if(unknown)issues.push('缺少單件標準分鐘或類型');
    const actual=Number(actualMinutes[date]);const usable=Number.isFinite(actual)&&actual>0&&issues.length===0;
    return{date,count:day.length,lifts:issues.length?null:batches.size,equivalent:unknown?null:equivalent,average:unknown?null:equivalent/day.length,standard:issues.length?null:standard,actual:actual>0?actual:null,factor:usable?standard/actual:null,perHour:usable?equivalent/(actual/60):null,issues:[...new Set(issues)]};
  });
}
function forecast(allMembers,remaining,settings,actualMinutes,asOf=TODAY){
  const days=analyzeDays(allMembers,settings,actualMinutes,asOf),valid=days.filter(day=>day.factor!==null);
  const actual=valid.reduce((sum,day)=>sum+day.actual,0),standard=valid.reduce((sum,day)=>sum+day.standard,0);
  const factor=actual>0?standard/actual:1,work=plannedWorkload(remaining,settings);
  const duration=work.cost===null?null:work.cost/factor;
  return{...work,factor,sampleDays:valid.length,duration,hours:duration===null?null:duration/60,days:duration===null?null:duration/settings.minutesPerDay};
}
function parseCsv(text){
  const rows=[];let row=[],field='',quoted=false;
  for(let index=0;index<text.length;index++){
    const character=text[index];if(character==='"'){if(quoted&&text[index+1]==='"'){field+='"';index++;}else quoted=!quoted;}
    else if(character===','&&!quoted){row.push(field);field='';}
    else if((character==='\n'||character==='\r')&&!quoted){if(character==='\r'&&text[index+1]==='\n')index++;row.push(field);if(row.some(value=>value!==''))rows.push(row);row=[];field='';}else field+=character;
  }
  if(quoted)throw Error('CSV 引號未結束');if(field||row.length){row.push(field);rows.push(row);}
  const header=rows.shift()?.map(value=>value.replace(/^\uFEFF/,'').trim());if(!header||new Set(header).size!==header.length)throw Error('CSV 標題列缺漏或重複');
  return rows.map((values,index)=>{if(values.length!==header.length)throw Error(`CSV 第 ${index+2} 列欄數不符`);return Object.fromEntries(header.map((key,position)=>[key,values[position]]));});
}
function normalizeDaily(rows){
  const result=Object.create(null),dates=new Set();
  for(const row of rows){const date=dateValue(row['吊裝日期']),value=Number(row['實際吊裝分鐘']);if(dates.has(date))throw Error('每日作業日期重複：'+date);dates.add(date);if(String(row['實際吊裝分鐘']??'').trim()===''&&String(row['實際總吊數']??'').trim()!=='')continue;if(!Number.isFinite(value)||value<=0)throw Error('實際吊裝分鐘須為正數：'+date);result[date]=value;}
  if(!rows.length)throw Error('每日作業 CSV 沒有資料');
  return result;
}
function normalizeActualLifts(rows){const result=Object.create(null);for(const row of rows){if(String(row['實際總吊數']??'').trim()==='')continue;const date=dateValue(row['吊裝日期']),value=Number(row['實際總吊數']);if(!Number.isInteger(value)||value<0)throw Error('實際總吊數須為非負整數');if(date>TODAY)throw Error('實際吊數不可填未來日期');if(Object.hasOwn(result,date))throw Error('實際吊數日期重複');result[date]=value;}return result;}
function normalizePlans(rows,members){
  const result=Object.create(null),sections=new Set(members.map(member=>member.section));
  for(const row of rows){const value=String(row['節次']||'').trim(),key=value==='全案'||value==='all'?'all':value;if(!key||key!=='all'&&!sections.has(key))throw Error('預計曲線節次不存在：'+value);if(String(row['預計累計數']??'').trim()==='')throw Error('預計累計數不可空白');result[key]??=[];result[key].push({date:row['日期'],count:row['預計累計數']});}
  if(!rows.length)throw Error('預計曲線 CSV 沒有資料');
  for(const key of Object.keys(result))result[key]=validatePlan(result[key],key==='all'?members.length:members.filter(member=>member.section===key).length);
  return result;
}

function simpleSheetToState(data){
  if(!data?.ok||data.schema!=='steel-sheet-api-v1'||!Array.isArray(data.rows))throw Error(data?.error||'API資料格式不符');
  const required=['完整名稱','標示數量合計','完成日'];
  const missing=required.filter(field=>!data.headers?.includes(field));if(missing.length)throw Error('Google Sheet 缺少欄位：'+missing.join('、'));
  const members=[],apiRows=Object.create(null),quantities=Object.create(null);let skippedName=0,skippedQuantity=0,invalidDates=0;
  for(const row of data.rows){
    const values=row.values||{},name=String(values['完整名稱']??'').trim(),rawQuantity=String(values['標示數量合計']??'').trim();
    if(!name){skippedName++;continue;}
    if(!/^[0-9]+$/.test(rawQuantity)||!Number.isSafeInteger(Number(rawQuantity))||Number(rawQuantity)<1){skippedQuantity++;continue;}
    const quantity=Number(rawQuantity),sourceRow=Number(row.rowNumber);
    if(!Number.isInteger(sourceRow)||sourceRow<2||members.length+quantity>200000)throw Error('資料列或標示數量超出網頁可處理範圍');
    let lift='';try{lift=dateValue(values['完成日'],true);}catch{invalidDates++;}
    const kind=String(values['構件類型']??'').trim()||'未分類',section=String(values['樓層／節次']??'').trim()||'未指定',analysis=['分區','樓層／節次','大梁方向(G/B)','小梁方向(X/Y)','流水號','構件類型','構件代碼','未拆分尾碼'].map(field=>String(values[field]??'')).join('｜');
    apiRows[sourceRow]=row;quantities[sourceRow]=quantity;
    for(let ordinal=1;ordinal<=quantity;ordinal++)members.push({id:sourceRow+':'+ordinal,sourceRow,ordinal,name,section,type:kind,analysis,lift,weld:''});
  }
  return{members,apiRows,quantities,skippedName,skippedQuantity,invalidDates};
}

function validApiUrl(value){const url=new URL(value);if(url.protocol!=='https:'||url.hostname!=='script.google.com'||!/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url.pathname))throw Error('請填Apps Script部署後的https://script.google.com/macros/s/…/exec網址');return url;}
function sheetApiJsonp(endpoint,action,payload){
  const url=validApiUrl(endpoint),callback='_steelApi_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  url.searchParams.set('action',action);url.searchParams.set('callback',callback);url.searchParams.set('_ts',String(Date.now()));if(payload)url.searchParams.set('payload',JSON.stringify(payload));
  if(action==='result')url.searchParams.set('requestId',payload.requestId);
  if(url.href.length>7500)throw Error('單次寫回內容過長，請分次更新');
  return new Promise((resolve,reject)=>{
    const script=document.createElement('script');let timer;
    const finish=()=>{clearTimeout(timer);script.remove();delete window[callback];};
    window[callback]=data=>{finish();if(data?.ok)resolve(data);else reject(Error(data?.error||'API未回傳成功結果'));};
    script.onerror=()=>{finish();reject(Error('無法連線；若剛才是寫回，請重新讀取確認，勿直接假定成功。'));};
    timer=setTimeout(()=>{finish();reject(Error('未取得API確認；請重新讀取確認是否已寫回。'));},30000);
    script.src=url.href;document.head.append(script);
  });
}
async function sheetApiRequest(endpoint,action,payload){
  if(action!=='write')return sheetApiJsonp(endpoint,action,payload);
  const url=validApiUrl(endpoint),requestId=crypto.randomUUID();
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);
  try{await fetch(url.href,{method:'POST',mode:'no-cors',credentials:'omit',signal:controller.signal,headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({...payload,action:'write',requestId})});}catch{throw Error('未取得寫回回應，請重新讀取確認，不直接假定成功。');}finally{clearTimeout(timer);}
  for(let attempt=0;attempt<15;attempt++){
    const receipt=await sheetApiJsonp(endpoint,'result',{requestId});if(!receipt.pending)return receipt;
    await new Promise(resolve=>setTimeout(resolve,800));
  }
  throw Error('未取得寫回確認，請重新讀取確認資料，勿直接假定成功。');
}

const get=id=>document.getElementById(id),fmt=value=>Number(value).toLocaleString('zh-TW'),dateText=value=>value?value.replaceAll('-','/'):'—';
const svgNode=(name,attributes={},value)=>{const node=document.createElementNS('http://www.w3.org/2000/svg',name);for(const [key,item] of Object.entries(attributes))node.setAttribute(key,item);if(value!==undefined)node.textContent=value;return node;};
const FIELDS=['完整名稱','分區','樓層／節次','大梁方向(G/B)','小梁方向(X/Y)','流水號','構件類型','構件代碼','未拆分尾碼','出現次數','標示數量合計','完成日'];
const PAGE=18,button=get('google-read');let state=null,section='all',query='',type='all',page=0,editing=null;
get('filter-column').replaceChildren(...FIELDS.map(field=>new Option(field,field)));
get('asof').textContent=dateText(TODAY);
function members(){return(state?.members||[]).filter(member=>section==='all'||member.section===section);}
function render(){
  const list=members(),done=list.filter(member=>member.lift&&member.lift<=TODAY),ratio=list.length?done.length/list.length:0;
  for(const [id,value] of Object.entries({total:state?fmt(list.length):'—',completed:state?fmt(done.length):'—',remaining:state?fmt(list.length-done.length):'—',percent:state?`${(ratio*100).toFixed(1)}%`:'—'}))get(id).textContent=value;
  get('completion-rate').textContent=state?`${fmt(done.length)} / ${fmt(list.length)} 件`:'等待資料';get('progress-fill').style.width=state?`${ratio*100}%`:'0%';
  renderMembers(list);renderChart(list,done);

function renderMembers(list){
  const field=get('filter-column').value;
  const filtered=list.filter(member=>(type==='all'||member.type===type)&&(!query||String(state?.apiRows?.[member.sourceRow]?.values?.[field]??'').toLocaleLowerCase().includes(query.toLocaleLowerCase())));

  const head=document.createElement('tr');for(const label of ['構件編號',...(get('show-analysis').checked?['分析編號']:[]),'完成日','操作']){const th=document.createElement('th');th.textContent=label;head.append(th);}get('members-head').replaceChildren(head);
  const body=get('members-body');body.replaceChildren();
  for(const member of filtered.slice(page*PAGE,(page+1)*PAGE)){

    const cell=row.insertCell();cell.textContent=dateText(member.lift);if(!member.lift)cell.className='empty-date';
    const action=row.insertCell(),edit=document.createElement('button');edit.textContent='填寫完成日';edit.onclick=()=>openDateEditor(member);action.append(edit);body.append(row);
  }
  get('table-count').textContent=state?`顯示 ${filtered.length?fmt(page*PAGE+1):0}–${fmt(Math.min((page+1)*PAGE,filtered.length))} / ${fmt(filtered.length)} 件`:'等待資料';
  get('page-number').textContent=`第 ${page+1} / ${Math.max(1,Math.ceil(filtered.length/PAGE))} 頁`;get('prev').disabled=page===0;get('next').disabled=(page+1)*PAGE>=filtered.length;
}
function renderChart(list,done){
  const svg=get('s-chart'),width=Math.max(320,svg.clientWidth||800),height=310,left=58,right=28,top=28,bottom=42;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.replaceChildren();
  if(!state){get('chart-note').textContent='等待 Google Sheet 資料';return;}
  const dates=[...new Set(done.map(member=>member.lift))].sort(),day=86400000,end=Date.parse(TODAY),start=Math.min(end,...dates.map(date=>Date.parse(date)))-day,span=Math.max(day,end-start),max=Math.max(list.length,1);
  const x=value=>left+(Date.parse(value)-start)/span*(width-left-right),y=value=>top+(max-value)/max*(height-top-bottom);
  for(let index=0;index<=4;index++){const count=Math.round(max*index/4),vertical=y(count);svg.append(svgNode('line',{x1:left,y1:vertical,x2:width-right,y2:vertical,stroke:'#e5edf2'}),svgNode('text',{x:left-12,y:vertical+4,'text-anchor':'end',fill:'#7c929f','font-size':12},fmt(count)));}
  const ticks=Math.min(width<500?3:6,Math.floor(span/day)+1);for(let index=0;index<ticks;index++){const date=new Date(start+span*index/(ticks-1)).toISOString().slice(0,10);svg.append(svgNode('text',{x:x(date),y:height-13,'text-anchor':'middle',fill:'#7c929f','font-size':12},date.slice(5).replace('-','/')));}
  let cumulative=0,path=`M ${left} ${y(0)}`;for(const date of dates){path+=` H ${x(date)}`;cumulative+=done.filter(member=>member.lift===date).length;path+=` V ${y(cumulative)}`;}path+=` H ${x(TODAY)}`;svg.append(svgNode('path',{d:path,fill:'none',stroke:'#347aa6','stroke-width':3,'stroke-linejoin':'round'}));
  get('chart-note').textContent=`截至 ${dateText(TODAY)}，已完成吊裝 ${fmt(done.length)} 件；尚餘 ${fmt(list.length-done.length)} 件`;
}
function openDateEditor(member){
  const source=state?.apiRows?.[member.sourceRow];if(!source){get('status').textContent='找不到此構件的來源列，請更新資料。';return;}
  editing={...source};get('date-title').textContent=member.name;
  const quantity=state.quantities[member.sourceRow];
  get('date-note').textContent=quantity>1?`此編號的標示數量為 ${quantity}；填寫日期會套用來源列的全部標示單位。`:'日期會寫回此編號的 Google Sheet 來源列。';
  get('date-input').value=source.values['完成日']||'';get('date-status').textContent='';get('date-dialog').showModal();
}
get('date-cancel').onclick=()=>get('date-dialog').close();
get('date-save').onclick=async()=>{
  if(!editing)return;
  const save=get('date-save');save.disabled=true;let written=false;
  try{
    const completed=dateValue(get('date-input').value,true);
    get('date-status').textContent='寫回中…';
    await sheetApiRequest(SHEET_API_URL,'write',{rowNumber:editing.rowNumber,name:editing.name,version:editing.version,changes:{'完成日':completed}});
    written=true;await readRemote();get('date-dialog').close();get('status').textContent='完成日已寫回 Google Sheet，並重新讀取最新資料。';
  }catch(error){get('date-status').textContent=(written?'已寫回，但重新讀取未完成：':'未完成寫回確認：')+error.message;}
  finally{save.disabled=false;}
};
async function readRemote(){
  button.disabled=true;button.textContent='讀取中…';get('status').textContent='正在讀取 Google Sheet…';
  try{
    const endpoint=validApiUrl(SHEET_API_URL).href,data=await sheetApiRequest(endpoint,'read');state=simpleSheetToState(data);section='all';page=0;
    const selector=get('section');selector.replaceChildren(new Option('全案','all'));for(const value of [...new Set(state.members.map(member=>member.section))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})))selector.add(new Option(value,value));
    const types=get('type-filter');types.replaceChildren(new Option('全部類型','all'));for(const value of [...new Set(state.members.map(member=>member.type))].sort())types.add(new Option(value,value));type='all';
    get('source').textContent='Google Sheet · 已更新';get('status').textContent='已讀取最新構件進度。'+(state.skippedName?` ${state.skippedName} 列缺少完整名稱，未計入件數。`:'')+(state.skippedQuantity?` ${state.skippedQuantity} 列數量未填或無法辨識，未計入件數。`:'')+(state.invalidDates?` ${state.invalidDates} 列完成日格式無法辨識，暫不列入已完成。`:'');render();
  }catch(error){get('source').textContent=state?'更新失敗 · 顯示上次資料':'Google Sheet 讀取失敗';get('status').textContent=`讀取未完成：${error.message}`;}
  finally{button.disabled=false;button.textContent='從 Google Sheet 更新';}
}
button.onclick=readRemote;get('section').onchange=event=>{section=event.target.value;page=0;render();};
get('search').oninput=event=>{query=event.target.value;page=0;renderMembers(members());};get('type-filter').onchange=event=>{type=event.target.value;page=0;renderMembers(members());};get('show-analysis').onchange=()=>renderMembers(members());
get('filter-column').onchange=()=>{page=0;renderMembers(members());};
get('prev').onclick=()=>{page--;renderMembers(members());};get('next').onclick=()=>{page++;renderMembers(members());};
new ResizeObserver(()=>renderChart(members(),members().filter(member=>member.lift&&member.lift<=TODAY))).observe(get('s-chart'));
render();readRemote();
